name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (check + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libmpv-dev libdbus-1-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  android:
    name: Android (build check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Rust Android target
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Generate Android project
        run: |
          npm run tauri -- android init --ci
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
      - name: Build APK
        run: npm run tauri -- android build --apk --target aarch64 --debug --ci

  windows:
    name: Windows (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Fetch LGPL libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv.ps1
      - run: cargo test
        working-directory: src-tauri
