name: Flutter CI

on:
  push:
    branches: [feat/flutter-core, main]
    paths:
      - 'crates/**'
      - 'flutter_app/**'
      - 'Cargo.toml'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [feat/flutter-core, main]
    paths:
      - 'crates/**'
      - 'flutter_app/**'
      - 'Cargo.toml'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    name: Rust Workspace (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: System packages
        timeout-minutes: 25
        run: |
          ./scripts/ci-apt-install.sh libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libmpv-dev libasound2-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Ensure Tauri frontendDist stub exists for workspace check
        run: |
          mkdir -p dist
          [ -f dist/index.html ] || printf '<!doctype html><html></html>\n' > dist/index.html

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  flutter-windows:
    name: Flutter Windows (analyze + test + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Fetch LGPL libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv.ps1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: flutter analyze
        working-directory: flutter_app
        run: flutter analyze

      - name: flutter test
        working-directory: flutter_app
        run: flutter test

      - name: flutter build windows
        working-directory: flutter_app
        run: flutter build windows --release

  flutter-android:
    name: Flutter Android (APK arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Rust Android target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: gradle/actions/setup-gradle@v4

      - name: Point Gradle/Cargokit at Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        working-directory: flutter_app
        run: flutter pub get

      - name: flutter build apk
        working-directory: flutter_app
        run: |
          if ! flutter build apk --release --target-platform android-arm64; then
            echo "::warning::flutter build apk failed; retrying once for transient Maven/Gradle errors..."
            flutter build apk --release --target-platform android-arm64
          fi
