name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0; empty uses v<version> from tauri.conf.json)'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows Release (test + installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch LGPL libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv.ps1

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Sync version from release tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $env:INPUT_TAG.Trim()
          } else {
            ''
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { return }
          $ver = $tag -replace '^v', ''
          if ($ver -match '^\d+\.\d+$') { $ver = "$ver.0" }
          if ($ver -notmatch '^\d+\.\d+\.\d+') { return }

          $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw
          $conf = [regex]::Replace($conf, '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`"", 1)
          Set-Content -Path 'src-tauri/tauri.conf.json' -Value $conf -NoNewline -Encoding utf8NoBOM

          $cargo = Get-Content 'src-tauri/Cargo.toml' -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]+"', "version = `"$ver`"", 1)
          Set-Content -Path 'src-tauri/Cargo.toml' -Value $cargo -NoNewline -Encoding utf8NoBOM

          $pkg = Get-Content 'package.json' -Raw
          $pkg = [regex]::Replace($pkg, '"version"\s*:\s*"[^"]+"', "`"version`": `"$ver`"", 1)
          Set-Content -Path 'package.json' -Value $pkg -NoNewline -Encoding utf8NoBOM

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # With the updater key the installer is also signed for in-app updates
      # (NeoModern_x.y.z_x64-setup.exe.sig, read into latest.json below).
      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host '::warning::TAURI_SIGNING_PRIVATE_KEY is not set; no in-app update for this release.'
            npm run tauri -- build --bundles nsis
          } else {
            npm run tauri -- build --bundles nsis --config src-tauri/tauri.updater.conf.json
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) {
            $env:INPUT_TAG.Trim()
          } else {
            $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
            "v$($conf.version)"
          }

          $installers = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe'
          if (-not $installers) {
            throw 'No NSIS .exe installer found in src-tauri/target/release/bundle/nsis'
          }
          $signatures = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe.sig')

          $staging = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $assets = @()
          $hashes = @()
          foreach ($file in $installers) {
            $dest = Join-Path $staging $file.Name
            Copy-Item -Path $file.FullName -Destination $dest -Force
            $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes += "$hash  $($file.Name)"
            $assets += $dest
          }

          foreach ($sig in $signatures) {
            $dest = Join-Path $staging $sig.Name
            Copy-Item -Path $sig.FullName -Destination $dest -Force
            $assets += $dest
          }

          if ($signatures.Count -gt 0) {
            $sigFile = $signatures[0]
            $exeName = $sigFile.Name.Substring(0, $sigFile.Name.Length - 4)
            $sigText = (Get-Content -Path $sigFile.FullName -Raw).Trim()
            $baseUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$tag/"
            $manifest = [ordered]@{
              version   = ($tag -replace '^v', '')
              notes     = "NeoModern $tag"
              pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = $sigText
                  url       = $baseUrl + [uri]::EscapeDataString($exeName)
                }
              }
            }
            $manifestFile = Join-Path $staging 'latest.json'
            Set-Content -Path $manifestFile -Value ($manifest | ConvertTo-Json -Depth 5) -Encoding utf8
            $assets += $manifestFile
          }

          $checksumFile = Join-Path $staging 'SHA256SUMS.txt'
          Set-Content -Path $checksumFile -Value ($hashes -join "`n") -Encoding utf8
          $assets += $checksumFile

          $ErrorActionPreference = 'Continue'
          gh release view $tag 2>&1 | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = 'Stop'

          if ($exists) {
            # If the release was created manually from the GitHub UI, keep it as a
            # draft until every platform job and updater-manifest finish.
            gh release edit $tag --draft=true
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $isPrerelease = ($env:INPUT_PRERELEASE -eq 'true') -or ($tag -match '-')
            $releaseArgs = @('release', 'create', $tag) + $assets + @(
              '--title', "NeoModern $tag",
              '--target', $env:GITHUB_SHA,
              '--generate-notes',
              # Stays a draft until every platform and latest.json are up
              # (the publish job below); the app never sees half a release.
              '--draft'
            )
            if ($isPrerelease) {
              $releaseArgs += '--prerelease'
            }
            & gh @releaseArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  # Runs after the Windows job, which creates the GitHub release.
  android-release:
    name: Android Release (APK)
    needs: windows-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust Android target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The runner image ships the Android SDK and NDK.
      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Resolve release tag and sync version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$(echo "${INPUT_TAG:-}" | xargs)" ]; then
            tag="$(echo "$INPUT_TAG" | xargs)"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          ver="${tag#v}"
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+$ ]]; then ver="$ver.0"; fi
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # versionName / versionCode of the APK come from this version.
            VER="$ver" node -e '
              const fs = require("fs")
              const p = "src-tauri/tauri.conf.json"
              const conf = JSON.parse(fs.readFileSync(p, "utf8"))
              conf.version = process.env.VER
              fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n")
            '
          fi

      - name: Generate Android project
        run: |
          npm run tauri -- android init --ci
          # The generated project has Tauri's default launcher icon.
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      # Always an optimised release build (a debug build is ~10x larger).
      - name: Build APK
        run: npm run tauri -- android build --apk --target aarch64 --ci

      # With the signing secrets set, the APK is signed with the same key
      # every time, so new versions install over old ones. Without them it is
      # signed with a throwaway key made for this run: it installs, but has
      # to be uninstalled before the next version can be installed.
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out_dir="src-tauri/gen/android/app/build/outputs/apk"
          staging="$RUNNER_TEMP/android-assets"
          mkdir -p "$staging"
          name="NeoModern-${RELEASE_TAG}-android-arm64"
          unsigned="$(find "$out_dir" -name '*release*.apk' | head -n 1)"
          [ -n "$unsigned" ] || { echo "No release APK found in $out_dir"; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
            out="$staging/$name.apk"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key (this APK cannot be updated in place)."
            export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS=throwaway
            keytool -genkeypair -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=NeoModern test" >/dev/null
            out="$staging/$name-testkey.apk"
          fi
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$ks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$out" \
            "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$out"
          rm -f "$ks"
          ls -lh "$staging"
          (cd "$staging" && sha256sum *.apk > SHA256SUMS-android.txt)
          echo "ANDROID_ASSETS=$staging" >> "$GITHUB_ENV"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$ANDROID_ASSETS"/* --clobber

  # Linux AppImage (self-contained, updates itself in the app). Built on
  # Ubuntu 24.04: its libmpv is the 0.37 (libmpv.so.2) libmpv2 needs; the
  # AppImage runs on distributions with glibc 2.39 or newer.
  linux-release:
    name: Linux Release (AppImage)
    needs: windows-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libmpv-dev libdbus-1-dev \
            patchelf file

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Resolve release tag and sync version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$(echo "${INPUT_TAG:-}" | xargs)" ]; then
            tag="$(echo "$INPUT_TAG" | xargs)"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          ver="${tag#v}"
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+$ ]]; then ver="$ver.0"; fi
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VER="$ver" node -e '
              const fs = require("fs")
              const p = "src-tauri/tauri.conf.json"
              const conf = JSON.parse(fs.readFileSync(p, "utf8"))
              conf.version = process.env.VER
              fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n")
            '
          fi

      # linuxdeploy is itself an AppImage; without FUSE on the runner it
      # has to extract itself.
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npm run tauri -- build --bundles appimage --config src-tauri/tauri.updater.conf.json
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; no in-app update for this AppImage."
            npm run tauri -- build --bundles appimage
          fi

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="src-tauri/target/release/bundle/appimage"
          staging="$RUNNER_TEMP/linux-assets"
          mkdir -p "$staging"
          cp "$dir"/*.AppImage "$staging"/
          cp "$dir"/*.AppImage.sig "$staging"/ 2>/dev/null || true
          (cd "$staging" && sha256sum *.AppImage > SHA256SUMS-linux.txt)
          ls -lh "$staging"
          gh release upload "$RELEASE_TAG" "$staging"/* --clobber

  # The manifest the in-app updater reads: version, notes and, per
  # platform, the installer URL and its signature.
  updater-manifest:
    name: Updater manifest (latest.json)
    needs: [windows-release, linux-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$(echo "${INPUT_TAG:-}" | xargs)" ]; then
            tag="$(echo "$INPUT_TAG" | xargs)"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          work="$RUNNER_TEMP/manifest"
          mkdir -p "$work"
          gh release download "$tag" --dir "$work" --pattern '*.sig' || true
          if ! ls "$work"/*.sig >/dev/null 2>&1; then
            echo "::warning::No updater signatures in $tag; latest.json is not published."
            exit 0
          fi
          TAG="$tag" WORK="$work" REPO="$GITHUB_REPOSITORY" node -e '
            const fs = require("fs"), path = require("path")
            const { TAG, WORK, REPO } = process.env
            const base = `https://github.com/${REPO}/releases/download/${TAG}/`
            const platforms = {}
            for (const sig of fs.readdirSync(WORK).filter((f) => f.endsWith(".sig"))) {
              const file = sig.slice(0, -4)
              const key = file.endsWith(".exe") ? "windows-x86_64"
                : file.endsWith(".AppImage") ? "linux-x86_64" : null
              if (!key) continue
              platforms[key] = {
                signature: fs.readFileSync(path.join(WORK, sig), "utf8").trim(),
                url: base + encodeURIComponent(file),
              }
            }
            const manifest = {
              version: TAG.replace(/^v/, ""),
              notes: `NeoModern ${TAG}`,
              pub_date: new Date().toISOString(),
              platforms,
            }
            fs.writeFileSync(path.join(WORK, "latest.json"), JSON.stringify(manifest, null, 2))
            console.log(JSON.stringify(manifest, null, 2))
          '
          gh release upload "$tag" "$work/latest.json" --clobber

  # Last step: make the release public once Windows, Android, the AppImage
  # and latest.json are all attached. Until then it is a draft, so the
  # in-app update check (which reads the latest public release) does not
  # offer a release whose files are still missing.
  publish:
    name: Publish release
    needs: [windows-release, android-release, linux-release, updater-manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$(echo "${INPUT_TAG:-}" | xargs)" ]; then
            tag="$(echo "$INPUT_TAG" | xargs)"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$tag" --draft=false
          fi
