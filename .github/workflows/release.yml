name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0; empty uses v<version> from flutter_app/pubspec.yaml)'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolves release tag, semantic version, and Flutter build metadata once
  # so all platform jobs produce consistent artifact names and version info.
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_name: ${{ steps.meta.outputs.build_name }}
      build_number: ${{ steps.meta.outputs.build_number }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve tag and version metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          pubspec_ver="$(awk '/^version:[[:space:]]*/{print $2; exit}' flutter_app/pubspec.yaml | tr -d '\r')"
          pubspec_base="${pubspec_ver%%+*}"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$(echo "${INPUT_TAG:-}" | xargs)" ]; then
            tag="$(echo "$INPUT_TAG" | xargs)"
          else
            tag="v${pubspec_base}"
          fi

          ver="${tag#v}"
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+$ ]]; then
            ver="${ver}.0"
          fi

          # Strip any pre-release suffix so Windows Runner.rc numeric macros stay valid.
          build_name="${ver%%-*}"
          if [[ ! "$build_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            build_name="${pubspec_base%%-*}"
          fi
          build_number="${GITHUB_RUN_NUMBER:-1}"

          prerelease="false"
          if [ "${INPUT_PRERELEASE:-false}" = "true" ] || [[ "$tag" == *-* ]]; then
            prerelease="true"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows Release (x64 zip)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Fetch LGPL libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv.ps1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Windows release
        working-directory: flutter_app
        shell: pwsh
        env:
          BUILD_NAME: ${{ needs.prepare.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release --build-name="$env:BUILD_NAME" --build-number="$env:BUILD_NUMBER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable zip and generate checksum
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'flutter_app\build\windows\x64\runner\Release'
          if (-not (Test-Path (Join-Path $releaseDir 'neomodern.exe'))) {
            throw "neomodern.exe not found in $releaseDir"
          }

          # CMake installs libmpv-2.dll beside neomodern.exe; fall back to src-tauri/lib if needed.
          $bundleDll = Join-Path $releaseDir 'libmpv-2.dll'
          if (-not (Test-Path $bundleDll)) {
            $fetchedDll = 'src-tauri\lib\libmpv-2.dll'
            if (-not (Test-Path $fetchedDll)) {
              throw "libmpv-2.dll not found in $releaseDir or $fetchedDll"
            }
            Copy-Item -Path $fetchedDll -Destination $bundleDll -Force
          }

          foreach ($required in @('neomodern.exe', 'flutter_windows.dll', 'neomodern_bridge.dll', 'libmpv-2.dll', 'data')) {
            if (-not (Test-Path (Join-Path $releaseDir $required))) {
              throw "Required runtime artifact '$required' missing from $releaseDir"
            }
          }

          $baseName = "NeoModern-$($env:VERSION)-windows-x64"
          $stageRoot = Join-Path $env:RUNNER_TEMP 'windows-stage'
          $stageDir = Join-Path $stageRoot $baseName
          $outDir = Join-Path $env:RUNNER_TEMP 'windows-assets'
          Remove-Item -Path $stageRoot, $outDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageDir, $outDir -Force | Out-Null

          Copy-Item -Path (Join-Path $releaseDir '*') -Destination $stageDir -Recurse -Force
          Get-ChildItem -Path $stageDir -Include '*.pdb', '*.lib', '*.exp' -Recurse -File | Remove-Item -Force

          $zipName = "$baseName.zip"
          $zipPath = Join-Path $outDir $zipName
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $outDir 'SHA256SUMS-windows.txt'
          [IO.File]::WriteAllText($checksumPath, "$hash  $zipName`n", [Text.UTF8Encoding]::new($false))
          Get-ChildItem -Path $outDir

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: ${{ runner.temp }}/windows-assets/*
          if-no-files-found: error

  linux:
    name: Linux Release (x64 AppImage)
    needs: prepare
    # Build on Ubuntu 22.04 so glibc requirements stay compatible across 22.04, 24.04, and 26.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Retries and switches mirrors if the runner's default apt mirror stalls.
      - name: System packages
        timeout-minutes: 25
        run: |
          ./scripts/ci-apt-install.sh clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev libssl-dev libdbus-1-dev \
            patchelf file

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build Linux release
        working-directory: flutter_app
        env:
          BUILD_NAME: ${{ needs.prepare.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: flutter build linux --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bundle_dir="flutter_app/build/linux/x64/release/bundle"
          if [ ! -x "$bundle_dir/neomodern" ]; then
            echo "::error::Flutter Linux binary not found at $bundle_dir/neomodern"
            exit 1
          fi

          tools_dir="$RUNNER_TEMP/appimage-tools"
          appdir="$RUNNER_TEMP/AppDir"
          staging="$RUNNER_TEMP/linux-assets"
          rm -rf "$tools_dir" "$appdir" "$staging"
          mkdir -p "$tools_dir" "$appdir/usr/bin" "$appdir/usr/lib" "$staging"

          linuxdeploy="$tools_dir/linuxdeploy-x86_64.AppImage"
          appimagetool="$tools_dir/appimagetool-x86_64.AppImage"
          curl -fsSL -o "$linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fsSL -o "$appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$linuxdeploy" "$appimagetool"

          # Keep the Flutter bundle structure (neomodern, data/, lib/libapp.so) under usr/bin/.
          cp -a "$bundle_dir"/. "$appdir/usr/bin/"

          desktop_file="$RUNNER_TEMP/neomodern.desktop"
          cat > "$desktop_file" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=NeoModern
          Comment=Modern music player
          Exec=neomodern
          Icon=neomodern
          Categories=AudioVideo;Audio;Player;Music;
          Terminal=false
          StartupWMClass=io.github.r0madeus.neomodern
          EOF

          icon_file="$RUNNER_TEMP/neomodern.png"
          cp "src-tauri/icons/128x128@2x.png" "$icon_file"

          linuxdeploy_libs=()
          for so in "$appdir"/usr/bin/lib/*.so*; do
            [ -e "$so" ] || continue
            if [ "$(basename "$so")" = "libapp.so" ]; then
              continue
            fi
            linuxdeploy_libs+=(-l "$so")
          done

          LD_LIBRARY_PATH="$appdir/usr/bin/lib:${LD_LIBRARY_PATH:-}" \
            "$linuxdeploy" \
            --appdir "$appdir" \
            -e "$appdir/usr/bin/neomodern" \
            "${linuxdeploy_libs[@]}" \
            -d "$desktop_file" \
            -i "$icon_file"

          # Avoid duplicate shared objects in usr/bin/lib/ while keeping libapp.so and symlink fallbacks.
          for so in "$appdir"/usr/bin/lib/*.so*; do
            [ -e "$so" ] || continue
            base="$(basename "$so")"
            if [ "$base" != "libapp.so" ] && [ -e "$appdir/usr/lib/$base" ]; then
              ln -sf "../../lib/$base" "$so"
            fi
          done

          # libmpv links against libjack.so.0, which linuxdeploy skips via the AppImage excludelist.
          # Newer desktop distros (e.g. Ubuntu 26) don't install JACK by default, so bundle it explicitly.
          libjack_src="$(ldconfig -p | awk '/libjack\.so\.0[[:space:]]/{print $NF; exit}')"
          if [ -z "$libjack_src" ]; then
            libjack_src="$(find /usr/lib /lib -maxdepth 3 -name 'libjack.so.0*' 2>/dev/null | head -n1 || true)"
          fi
          libjack_real=""
          if [ -n "$libjack_src" ]; then
            libjack_real="$(readlink -f "$libjack_src" || true)"
          fi
          if [ -z "$libjack_real" ] || [ ! -f "$libjack_real" ]; then
            echo "::error::Could not locate libjack.so.0 on build runner"
            exit 1
          fi
          cp -L "$libjack_real" "$appdir/usr/lib/libjack.so.0"
          patchelf --set-rpath '$ORIGIN' "$appdir/usr/lib/libjack.so.0"
          patchelf --set-rpath '$ORIGIN/../lib:$ORIGIN/lib' "$appdir/usr/bin/neomodern"

          appimage_name="NeoModern-${VERSION}-linux-x86_64.AppImage"
          ARCH=x86_64 "$appimagetool" "$appdir" "$staging/$appimage_name"
          chmod +x "$staging/$appimage_name"
          (cd "$staging" && sha256sum "$appimage_name" > SHA256SUMS-linux.txt)
          ls -lh "$staging"

      - name: Verify AppImage bundled libraries
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=("$RUNNER_TEMP"/linux-assets/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::Expected 1 AppImage, found ${#appimages[@]}"
            exit 1
          fi

          appimage_abs="$(readlink -f "${appimages[0]}")"
          verify_dir="$RUNNER_TEMP/appimage-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          (
            cd "$verify_dir"
            "$appimage_abs" --appimage-extract >/dev/null

            for required in \
              squashfs-root/usr/bin/neomodern \
              squashfs-root/usr/bin/data/icudtl.dat \
              squashfs-root/usr/bin/lib/libapp.so \
              squashfs-root/usr/lib/libjack.so.0 \
              squashfs-root/usr/lib/libneomodern_bridge.so \
              squashfs-root/usr/lib/libflutter_linux_gtk.so; do
              if [ ! -e "$required" ]; then
                echo "::error::Missing required file in AppImage: $required"
                exit 1
              fi
            done

            mpv_libs=(squashfs-root/usr/lib/libmpv.so*)
            if [ "${#mpv_libs[@]}" -eq 0 ]; then
              echo "::error::libmpv.so* was not bundled into squashfs-root/usr/lib/"
              exit 1
            fi

            ldd_out="$(env -u LD_LIBRARY_PATH ldd squashfs-root/usr/bin/neomodern)"
            echo "$ldd_out"
            if echo "$ldd_out" | grep -q "not found"; then
              echo "::error::Missing shared library dependencies in neomodern binary"
              exit 1
            fi

            expected_jack="$(readlink -f squashfs-root/usr/lib/libjack.so.0)"
            jack_resolved="$(echo "$ldd_out" | awk '/libjack\.so\.0[[:space:]]*=>/{print $3; exit}')"
            if [ -z "$jack_resolved" ] || [ "$(readlink -f "$jack_resolved" || true)" != "$expected_jack" ]; then
              echo "::error::neomodern did not resolve libjack.so.0 from bundled usr/lib (got: ${jack_resolved:-<empty>})"
              exit 1
            fi

            expected_lib_dir="$(readlink -f squashfs-root/usr/lib)"
            mpv_resolved="$(echo "$ldd_out" | awk '/libmpv\.so\.[0-9]+[[:space:]]*=>/{print $3; exit}')"
            if [ -z "$mpv_resolved" ]; then
              echo "::error::neomodern did not link or resolve libmpv (got empty path)"
              exit 1
            fi
            mpv_resolved_dir="$(dirname "$(readlink -f "$mpv_resolved" || true)")"
            if [ "$mpv_resolved_dir" != "$expected_lib_dir" ]; then
              echo "::error::neomodern did not resolve libmpv from bundled usr/lib (got: $mpv_resolved)"
              exit 1
            fi

            for target in \
              squashfs-root/usr/lib/libjack.so.0 \
              squashfs-root/usr/lib/libmpv.so* \
              squashfs-root/usr/lib/libneomodern_bridge.so \
              squashfs-root/usr/lib/libflutter_linux_gtk.so; do
              [ -e "$target" ] || continue
              if LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" ldd "$target" | grep -q "not found"; then
                echo "::error::Unresolved shared library in $target"
                LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" ldd "$target"
                exit 1
              fi
            done
          )
          rm -rf "$verify_dir"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: ${{ runner.temp }}/linux-assets/*
          if-no-files-found: error

  android:
    name: Android Release (arm64 APK)
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Rust Android target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Point Gradle/Cargokit at Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build arm64 APK
        working-directory: flutter_app
        env:
          BUILD_NAME: ${{ needs.prepare.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: flutter build apk --release --target-platform android-arm64 --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Sign APK and generate checksum
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out_dir="flutter_app/build/app/outputs/flutter-apk"
          staging="$RUNNER_TEMP/android-assets"
          rm -rf "$staging"
          mkdir -p "$staging"

          apk_in="$(find "$out_dir" -maxdepth 1 -name '*release*.apk' | head -n 1)"
          if [ -z "$apk_in" ]; then
            echo "::error::No release APK found in $out_dir"
            exit 1
          fi

          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          ks="$RUNNER_TEMP/release.jks"
          base_name="NeoModern-${VERSION}-android-arm64"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            for req in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!req:-}" ]; then
                echo "::error::$req must be set when ANDROID_KEYSTORE_BASE64 is configured"
                exit 1
              fi
            done
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
            apk_out="$staging/$base_name.apk"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key (this APK cannot be updated in place)."
            export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS="throwaway"
            keytool -genkeypair -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=NeoModern test" >/dev/null
            apk_out="$staging/$base_name-testkey.apk"
          fi

          "$tools/zipalign" -f -p 4 "$apk_in" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$ks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk_out" \
            "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$apk_out"
          rm -f "$ks" "$RUNNER_TEMP/aligned.apk"

          (cd "$staging" && sha256sum *.apk > SHA256SUMS-android.txt)
          ls -lh "$staging"

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: ${{ runner.temp }}/android-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows, linux, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Combine and verify checksums
        run: |
          set -euo pipefail
          assets_dir="$RUNNER_TEMP/release-assets"
          cd "$assets_dir"
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -lh "$assets_dir"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets_dir="$RUNNER_TEMP/release-assets"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$assets_dir"/* --clobber
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            args=(
              release create "$TAG"
              "$assets_dir"/*
              --title "NeoModern $TAG"
              --target "$GITHUB_SHA"
              --generate-notes
            )
            if [ "${PRERELEASE:-false}" = "true" ] || [[ "$TAG" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
