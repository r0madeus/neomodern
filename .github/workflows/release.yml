name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0; empty uses v<version> from tauri.conf.json)'
        required: false
        type: string
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Creates (or locks as draft) the GitHub release upfront so Windows,
  # Android and Linux can build and upload in parallel.
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and create draft release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$(echo "${INPUT_TAG:-}" | xargs)" ]; then
            tag="$(echo "$INPUT_TAG" | xargs)"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          ver="${tag#v}"
          if [[ "$ver" =~ ^[0-9]+\.[0-9]+$ ]]; then ver="$ver.0"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft=true
          else
            args=(release create "$tag" --title "NeoModern $tag" --target "$GITHUB_SHA" --generate-notes --draft)
            if [ "${INPUT_PRERELEASE:-false}" = "true" ] || [[ "$tag" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

  windows-release:
    name: Windows Release (installer)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch LGPL libmpv
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-libmpv.ps1

      - run: npm ci

      - name: Sync version from release tag
        shell: pwsh
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:VER -notmatch '^\d+\.\d+\.\d+') { return }

          $conf = Get-Content 'src-tauri/tauri.conf.json' -Raw
          $conf = [regex]::Replace($conf, '"version"\s*:\s*"[^"]+"', "`"version`": `"$($env:VER)`"", 1)
          Set-Content -Path 'src-tauri/tauri.conf.json' -Value $conf -NoNewline -Encoding utf8NoBOM

          $cargo = Get-Content 'src-tauri/Cargo.toml' -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]+"', "version = `"$($env:VER)`"", 1)
          Set-Content -Path 'src-tauri/Cargo.toml' -Value $cargo -NoNewline -Encoding utf8NoBOM

          $pkg = Get-Content 'package.json' -Raw
          $pkg = [regex]::Replace($pkg, '"version"\s*:\s*"[^"]+"', "`"version`": `"$($env:VER)`"", 1)
          Set-Content -Path 'package.json' -Value $pkg -NoNewline -Encoding utf8NoBOM

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host '::warning::TAURI_SIGNING_PRIVATE_KEY is not set; no in-app update for this release.'
            npm run tauri -- build --bundles nsis
          } else {
            npm run tauri -- build --bundles nsis --config src-tauri/tauri.updater.conf.json
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG

          $installers = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe'
          if (-not $installers) {
            throw 'No NSIS .exe installer found in src-tauri/target/release/bundle/nsis'
          }
          $signatures = @(Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe.sig')

          $staging = Join-Path $env:RUNNER_TEMP 'release-assets'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $assets = @()
          $hashes = @()
          foreach ($file in $installers) {
            $dest = Join-Path $staging $file.Name
            Copy-Item -Path $file.FullName -Destination $dest -Force
            $hash = (Get-FileHash -Path $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            $hashes += "$hash  $($file.Name)"
            $assets += $dest
          }

          foreach ($sig in $signatures) {
            $dest = Join-Path $staging $sig.Name
            Copy-Item -Path $sig.FullName -Destination $dest -Force
            $assets += $dest
          }

          if ($signatures.Count -gt 0) {
            $sigFile = $signatures[0]
            $exeName = $sigFile.Name.Substring(0, $sigFile.Name.Length - 4)
            $sigText = (Get-Content -Path $sigFile.FullName -Raw).Trim()
            $baseUrl = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$tag/"
            $manifest = [ordered]@{
              version   = ($tag -replace '^v', '')
              notes     = "NeoModern $tag"
              pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = $sigText
                  url       = $baseUrl + [uri]::EscapeDataString($exeName)
                }
              }
            }
            $manifestFile = Join-Path $staging 'latest.json'
            Set-Content -Path $manifestFile -Value ($manifest | ConvertTo-Json -Depth 5) -Encoding utf8
            $assets += $manifestFile
          }

          $checksumFile = Join-Path $staging 'SHA256SUMS.txt'
          Set-Content -Path $checksumFile -Value ($hashes -join "`n") -Encoding utf8
          $assets += $checksumFile

          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  android-release:
    name: Android Release (APK)
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Rust Android target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Point Tauri at the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Sync version from release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            node -e '
              const fs = require("fs")
              const p = "src-tauri/tauri.conf.json"
              const conf = JSON.parse(fs.readFileSync(p, "utf8"))
              conf.version = process.env.VER
              fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n")
            '
          fi

      - name: Generate Android project
        run: |
          npm run tauri -- android init --ci
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/

      - name: Build APK
        run: npm run tauri -- android build --apk --target aarch64 --ci

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          out_dir="src-tauri/gen/android/app/build/outputs/apk"
          staging="$RUNNER_TEMP/android-assets"
          mkdir -p "$staging"
          name="NeoModern-${RELEASE_TAG}-android-arm64"
          unsigned="$(find "$out_dir" -name '*release*.apk' | head -n 1)"
          [ -n "$unsigned" ] || { echo "No release APK found in $out_dir"; exit 1; }
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          ks="$RUNNER_TEMP/release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks"
            out="$staging/$name.apk"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; signing with a throwaway key (this APK cannot be updated in place)."
            export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS=throwaway
            keytool -genkeypair -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=NeoModern test" >/dev/null
            out="$staging/$name-testkey.apk"
          fi
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$ks" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$out" \
            "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$out"
          rm -f "$ks"
          ls -lh "$staging"
          (cd "$staging" && sha256sum *.apk > SHA256SUMS-android.txt)
          echo "ANDROID_ASSETS=$staging" >> "$GITHUB_ENV"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "$ANDROID_ASSETS"/* --clobber

  linux-release:
    name: Linux Release (AppImage)
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libmpv-dev libdbus-1-dev \
            patchelf file

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Sync version from release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VER: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          if [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            node -e '
              const fs = require("fs")
              const p = "src-tauri/tauri.conf.json"
              const conf = JSON.parse(fs.readFileSync(p, "utf8"))
              conf.version = process.env.VER
              fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n")
            '
          fi

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # libmpv links against libjack.so.0, which linuxdeploy omits via the
          # AppImage excludelist. Newer desktop distros (e.g. Ubuntu 26) don't
          # install JACK by default, so bundle libjack.so.0 via appimage.files
          # before linuxdeploy packs and Tauri signs the updater artifact.
          libjack_src="$(ldconfig -p | awk '/libjack\.so\.0[[:space:]]/{print $NF; exit}')"
          if [ -z "$libjack_src" ]; then
            libjack_src="$(find /usr/lib /lib -maxdepth 3 -name 'libjack.so.0*' 2>/dev/null | head -n1 || true)"
          fi
          libjack_real=""
          if [ -n "$libjack_src" ]; then
            libjack_real="$(readlink -f "$libjack_src" || true)"
          fi
          if [ -z "$libjack_real" ] || [ ! -f "$libjack_real" ]; then
            echo "::error::Could not locate libjack.so.0 on build runner"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/appimage-extra"
          cp -L "$libjack_real" "$RUNNER_TEMP/appimage-extra/libjack.so.0"
          LIBJACK_STAGED="$RUNNER_TEMP/appimage-extra/libjack.so.0"
          APPIMAGE_CFG="$RUNNER_TEMP/appimage-files.json"
          LIBJACK_STAGED="$LIBJACK_STAGED" APPIMAGE_CFG="$APPIMAGE_CFG" node -e '
            const fs = require("fs");
            const cfg = {
              bundle: {
                linux: {
                  appimage: {
                    files: {
                      "/usr/lib/libjack.so.0": process.env.LIBJACK_STAGED
                    }
                  }
                }
              }
            };
            fs.writeFileSync(process.env.APPIMAGE_CFG, JSON.stringify(cfg, null, 2) + "\n");
          '
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npm run tauri -- build --bundles appimage --config "$APPIMAGE_CFG" --config src-tauri/tauri.updater.conf.json
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; no in-app update for this AppImage."
            npm run tauri -- build --bundles appimage --config "$APPIMAGE_CFG"
          fi

      - name: Verify AppImage bundled libraries
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::Expected 1 AppImage, found ${#appimages[@]}"
            exit 1
          fi
          appimage_abs="$(readlink -f "${appimages[0]}")"
          verify_dir="$RUNNER_TEMP/appimage-verify"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          (
            cd "$verify_dir"
            "$appimage_abs" --appimage-extract >/dev/null
            if [ ! -f squashfs-root/usr/lib/libjack.so.0 ]; then
              echo "::error::libjack.so.0 was not bundled into squashfs-root/usr/lib/"
              exit 1
            fi
            ldd_out="$(env -u LD_LIBRARY_PATH ldd squashfs-root/usr/bin/neomodern)"
            echo "$ldd_out"
            if echo "$ldd_out" | grep -q "not found"; then
              echo "::error::Missing shared library dependencies in neomodern binary"
              exit 1
            fi
            expected_jack="$(readlink -f squashfs-root/usr/lib/libjack.so.0)"
            jack_resolved="$(echo "$ldd_out" | awk '/libjack\.so\.0[[:space:]]*=>/{print $3; exit}')"
            if [ -z "$jack_resolved" ] || [ "$(readlink -f "$jack_resolved" || true)" != "$expected_jack" ]; then
              echo "::error::neomodern did not resolve libjack.so.0 from bundled usr/lib (got: ${jack_resolved:-<empty>})"
              exit 1
            fi
            for target in squashfs-root/usr/lib/libjack.so.0 squashfs-root/usr/lib/libmpv.so* squashfs-root/usr/lib/webkit2gtk-4.1/WebKitWebProcess; do
              [ -e "$target" ] || continue
              if LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib:$PWD/squashfs-root/usr/lib/webkit2gtk-4.1" ldd "$target" | grep -q "not found"; then
                echo "::error::Unresolved shared library in $target"
                LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib:$PWD/squashfs-root/usr/lib/webkit2gtk-4.1" ldd "$target"
                exit 1
              fi
            done
          )
          rm -rf "$verify_dir"

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="src-tauri/target/release/bundle/appimage"
          staging="$RUNNER_TEMP/linux-assets"
          mkdir -p "$staging"
          cp "$dir"/*.AppImage "$staging"/
          cp "$dir"/*.AppImage.sig "$staging"/ 2>/dev/null || true
          (cd "$staging" && sha256sum *.AppImage > SHA256SUMS-linux.txt)
          ls -lh "$staging"
          gh release upload "$RELEASE_TAG" "$staging"/* --clobber

  updater-manifest:
    name: Updater manifest (latest.json)
    needs: [prepare, windows-release, linux-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Write and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          work="$RUNNER_TEMP/manifest"
          mkdir -p "$work"
          gh release download "$tag" --dir "$work" --pattern '*.sig' || true
          if ! ls "$work"/*.sig >/dev/null 2>&1; then
            echo "::warning::No updater signatures in $tag; latest.json is not published."
            exit 0
          fi
          TAG="$tag" WORK="$work" REPO="$GITHUB_REPOSITORY" node -e '
            const fs = require("fs"), path = require("path")
            const { TAG, WORK, REPO } = process.env
            const base = `https://github.com/${REPO}/releases/download/${TAG}/`
            const platforms = {}
            for (const sig of fs.readdirSync(WORK).filter((f) => f.endsWith(".sig"))) {
              const file = sig.slice(0, -4)
              const key = file.endsWith(".exe") ? "windows-x86_64"
                : file.endsWith(".AppImage") ? "linux-x86_64" : null
              if (!key) continue
              platforms[key] = {
                signature: fs.readFileSync(path.join(WORK, sig), "utf8").trim(),
                url: base + encodeURIComponent(file),
              }
            }
            const manifest = {
              version: TAG.replace(/^v/, ""),
              notes: `NeoModern ${TAG}`,
              pub_date: new Date().toISOString(),
              platforms,
            }
            fs.writeFileSync(path.join(WORK, "latest.json"), JSON.stringify(manifest, null, 2))
            console.log(JSON.stringify(manifest, null, 2))
          '
          gh release upload "$tag" "$work/latest.json" --clobber

  publish:
    name: Publish release
    needs: [prepare, windows-release, android-release, linux-release, updater-manifest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false
          fi
